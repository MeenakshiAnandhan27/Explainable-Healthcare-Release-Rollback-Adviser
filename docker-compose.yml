version: '3.8'

services:
  rollback-adviser:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: healthcare-rollback-adviser
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    volumes:
      # Mount data volume for persistent audit logs in staging
      - ./data:/app/data
      - ./rules:/app/rules
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
